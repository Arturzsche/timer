<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronômetro de Estudos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="display">00:00:00<span id="milliseconds">.00</span></div>
        
        <div class="buttons">
            <button id="startBtn">Iniciar</button>
            <button id="pauseBtn">Pausar</button>
            <button id="resetBtn">Zerar e Salvar</button>
        </div>

        <div class="extras">
            <div class="goal-setting">
                <label for="goalInput">Meta da sessão (min):</label>
                <input type="number" id="goalInput" value="50" min="1">
            </div>
            
            <div class="log-section">
                <h3>Tempo Estudado na Semana</h3>
                <ul id="weeklyLog"></ul>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
